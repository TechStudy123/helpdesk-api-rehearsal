# プルリクエストごと（と main への push）に動くテスト: だまされる偽の LLM で、攻撃の例を全部回す
# API キーは使わない（お金がかからず、毎回同じ結果になる）
name: test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read                      # このワークフローに渡す権限は「読む」だけ

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pytest -v
