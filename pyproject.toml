[project]
name = "helpdesk-api"
version = "0.1.0"
description = "みらい商事のヘルプデスク API（LLM アプリのセキュリティの練習用）"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.142.4",
    "sqlmodel==0.0.48",
    "google-genai==2.29.0",
    "openai==3.26.0",
    "anthropic==1.12.1",
    "python-dotenv==1.2.4",
    "pyjwt==2.15.1",
    "pwdlib[argon2]==0.3.1",
    "numpy==2.5.3",
    "pypdf==6.19.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# テストの名前（parametrize の id）の日本語を、そのまま表示する（既定では \u53d6… のように表示される）
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
